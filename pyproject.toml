[project]
name = "analytics-serlo-hochschulmathematik"
version = "0.1.0"
description = "Analytics of page views for the project „Serlo Hochschulmathematik“"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "diskcache>=5.6.3",
    "jupyter>=1.1.1",
    "jupyter-ai>=3.1.2",
    "langchain-openai>=1.4.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.uv]
exclude-newer = "3 days"
